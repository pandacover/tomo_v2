name: Deploy Tomo

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-cutover
    paths:
      - "cloudflare/**"
      - "tomo_core/Dockerfile.cloudflare"
      - "tomo_core/IMAGE_REVISION"
      - "tomo_core/SOUL.md"
      - "tomo_core/pyproject.toml"
      - "tomo_core/uv.lock"
      - "tomo_core/src/**"
      - ".github/workflows/deploy-tomo.yml"

permissions:
  contents: read

concurrency:
  group: deploy-tomo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install
        run: npm ci

      - name: Configure deployment
        env:
          TOMO_CORE_MODEL: ${{ secrets.TOMO_CORE_MODEL }}
          TOMO_MM_MODEL: ${{ secrets.TOMO_MM_MODEL }}
          TOMO_IMAGE_REVISION: ${{ github.sha }}
        run: |
          if [[ -z "$TOMO_CORE_MODEL" || -z "$TOMO_MM_MODEL" ]]; then
            echo "::error::TOMO_CORE_MODEL and TOMO_MM_MODEL must both be configured."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const path = "wrangler.jsonc";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.vars.TOMO_AGENT_MODEL = process.env.TOMO_CORE_MODEL;
            config.vars.TOMO_VISION_MODEL = process.env.TOMO_MM_MODEL;
            config.vars.TOMO_IMAGE_REVISION = process.env.TOMO_IMAGE_REVISION;
            const probeToken = crypto.randomBytes(32).toString("hex");
            config.vars.TOMO_DEPLOY_PROBE_TOKEN = probeToken;
            fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
            fs.writeFileSync("../tomo_core/IMAGE_REVISION", `${process.env.TOMO_IMAGE_REVISION}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `TOMO_DEPLOY_PROBE_TOKEN=${probeToken}\n`);
          '

      - name: Types
        run: npm run types

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          worker_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          if [[ -z "$worker_url" ]]; then
            echo "Could not find workers.dev URL in Wrangler output." >&2
            exit 1
          fi
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Wait for /health
        run: |
          set -e
          for attempt in $(seq 1 30); do
            code="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              "$WORKER_URL/health")" || code=0
            if [[ "$code" == "200" ]]; then
              echo "Ready: $WORKER_URL (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: /health returned $code"
            sleep 10
          done
          echo "::error::$WORKER_URL/health did not return 200"
          exit 1

      - name: Prove Worker and guest provenance
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 210 \
            --request POST \
            --header "Authorization: Bearer $TOMO_DEPLOY_PROBE_TOKEN" \
            --output "$RUNNER_TEMP/provenance.json" \
            "$WORKER_URL/v1/ops/provenance"
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/provenance.json", "utf8"));
            if (!result.ok || result.worker_revision !== process.env.GITHUB_SHA || result.guest_revision !== process.env.GITHUB_SHA) {
              throw new Error("Worker/guest provenance mismatch");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nWorker revision: \`${result.worker_revision}\`\n\nGuest image revision: \`${result.guest_revision}\`\n`);
            console.log(`Provenance verified at ${result.worker_revision}`);
          '

      - name: Summary
        if: always()
        run: |
          {
            echo "# Tomo deploy"
            echo
            echo "Worker URL: \`${WORKER_URL:-unknown}\`"
            echo
            echo "Cloudflare keeps the existing Worker secrets during deploy."
          } | tee -a "$GITHUB_STEP_SUMMARY"
