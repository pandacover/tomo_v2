name: Inspect Tomo

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-cutover
    paths:
      - ".github/workflows/inspect-tomo.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
        working-directory: cloudflare
      - name: Health, secrets names, vars, logs
        working-directory: cloudflare
        run: |
          echo "## health"
          curl -sS -i --max-time 15 https://tomo.luvmakin01.workers.dev/health | head -n 20

          echo "## secret names"
          npx wrangler secret list --name tomo || true

          echo "## deployments"
          npx wrangler deployments list --name tomo || true

          echo "## script settings"
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/tomo/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq '{success, errors, result: (.result | {bindings: [.bindings[]? | {type, name}]})}'

          echo "## recent logs"
          to="$(($(date +%s) * 1000))"
          from="$((to - 7200000))"
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --argjson from "$from" --argjson to "$to" '{
              queryId: "tomo-debug",
              timeframe: {from: $from, to: $to},
              view: "events",
              datasets: ["workers_observability"],
              filters: [{kind:"filter", key:"$metadata.service", operation:"eq", type:"string", value:"tomo"}],
              limit: 50,
              chart: false
            }')" | jq '{success, errors, keys: (.result | keys), sample: .}' | head -c 20000
