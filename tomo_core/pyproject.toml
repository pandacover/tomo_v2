[project]
name = "tomo-core"
version = "0.1.0"
description = "conversational personal agent core with telegram-first delivery"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "langgraph>=0.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "daytona==0.195.0",
]

[project.scripts]
tomo-core = "tomo_core.cli:main"

[project.optional-dependencies]
test = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomo_core"]
